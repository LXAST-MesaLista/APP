org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dirección de la API del servidor de MesaLista en la versión «release» (la que
# se instala en los móviles). Siempre HTTPS. Cámbiala si el servidor tiene otro
# dominio y vuelve a compilar.
mesalista.api=https://lapp.spaincentral.cloudapp.azure.com/api/v1

# Versión «debug» (desarrollo, en el emulador): la API de desarrollo de este
# ordenador. 10.0.2.2 es, desde el emulador, el 127.0.0.1 del ordenador.
mesalista.api.debug=http://10.0.2.2:8091/api/v1
